<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projector Frame Designer</title>
<style>
  :root {
    --bg: #15171a; --panel: #1e2125; --line: #30353b; --text: #e7e9ec; --muted: #9aa2ab;
    --accent: #f5a524; --accent-ink: #1b1300; --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { display: grid; grid-template-columns: 1fr 320px; height: 100vh; }
  .stage { position: relative; overflow: hidden; }
  canvas#view { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  canvas#view.dragging { cursor: grabbing; }
  .hint { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px;
    background: rgba(0,0,0,.45); padding: 4px 8px; border-radius: 6px; pointer-events: none; }
  .drop { position: absolute; inset: 12px; border: 2px dashed var(--accent); border-radius: 12px;
    display: none; align-items: center; justify-content: center; font-size: 18px;
    background: rgba(245,165,36,.08); pointer-events: none; }
  .drop.on { display: flex; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 16px 24px; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 18px 0 8px; font-weight: 600; }
  label.row { display: grid; grid-template-columns: 1fr 86px; align-items: center; gap: 8px; margin: 6px 0; }
  label.row span { color: var(--muted); }
  input[type=number] { width: 100%; background: #111316; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 6px; font: inherit; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .slider { margin: 4px 0 10px; }
  .slider .top { display: flex; justify-content: space-between; color: var(--muted); }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  button { background: #2a2f35; color: var(--text); border: 1px solid var(--line); border-radius: 7px;
    padding: 7px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: #4a525b; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: progress; }
  .check { display: flex; gap: 8px; align-items: center; margin: 6px 0; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; padding: 6px 10px; }
  .seg button.on { background: #3a4047; }
  #status { margin-top: 10px; color: var(--muted); white-space: pre-wrap; font-size: 12px; min-height: 1.4em; }
  #status.err { color: var(--danger); }
  .result img { width: 100%; border-radius: 8px; border: 1px solid var(--line); margin-top: 8px; cursor: zoom-in; }
  a.dl { color: var(--accent); }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center;
    justify-content: center; z-index: 10; cursor: zoom-out; }
  .modal.on { display: flex; }
  .modal img { max-width: 96vw; max-height: 94vh; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="view"></canvas>
    <div class="drop" id="drop">Drop an image to load it</div>
    <div class="hint">Drag the picture to move it · scroll to resize · arrow keys nudge (Shift = 10 mm)</div>
  </div>
  <aside>
    <h1>Projector Frame Designer</h1>

    <h2>Picture</h2>
    <div class="btns">
      <button id="load">Load image…</button>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
    <div class="slider">
      <div class="top"><span>Size (width on the wall)</span><span id="sizeLabel"></span></div>
      <input type="range" id="size" min="50" max="1500" step="1">
    </div>
    <label class="row"><span>Position X (mm, right +)</span><input type="number" id="cx" step="1"></label>
    <label class="row"><span>Position Y (mm, up +)</span><input type="number" id="cy" step="1"></label>
    <div class="btns">
      <button id="fitW">Fit width</button>
      <button id="fitH">Fit height</button>
      <button id="center">Center</button>
    </div>

    <h2>Light / dark</h2>
    <div class="slider">
      <div class="top"><span>Threshold</span><span id="thrLabel"></span></div>
      <input type="range" id="thr" min="0.05" max="0.95" step="0.01">
    </div>
    <label class="check"><input type="checkbox" id="invert"> Invert (dark parts become light)</label>
    <div class="check">View:
      <span class="seg"><button id="vStencil" class="on">Stencil</button><button id="vPhoto">Picture</button></span>
    </div>

    <h2>Frame</h2>
    <label class="row"><span>Photo width (mm)</span><input type="number" id="picture_w" step="1" min="40"></label>
    <label class="row"><span>Photo height (mm)</span><input type="number" id="picture_h" step="1" min="40"></label>
    <label class="row"><span>Frame depth (mm)</span><input type="number" id="depth" step="1" min="30"></label>
    <label class="row"><span>Light height (mm)</span><input type="number" id="light_z" step="1" min="15"></label>
    <label class="row"><span>Reach (× frame size)</span><input type="number" id="max_magnification" step="0.1" min="1.5" max="8"></label>

    <h2>Generate</h2>
    <div class="btns">
      <button id="preview">Preview projection</button>
      <button id="build" class="primary">Generate STLs</button>
    </div>
    <div id="status"></div>
    <div class="result" id="result"></div>
  </aside>
</div>
<div class="modal" id="modal"><img id="modalImg" alt=""></div>

<script>
const $ = id => document.getElementById(id);
const canvas = $('view'), ctx = canvas.getContext('2d');

const FRAME_KEYS = ['picture_w', 'picture_h', 'depth', 'light_z', 'max_magnification'];
const state = {
  frame: { picture_w: 150, picture_h: 100, depth: 60, light_z: 48, max_magnification: 3.5 },
  width: 500, cx: 0, cy: 0, threshold: 0.5, invert: false, view: 'stencil',
};
let geo = null;            // lit-area geometry from the server
let img = null;            // HTMLImageElement
let imgData = null;        // data URL sent to the server
let stencil = null;        // thresholded canvas
let busy = false;

// ---------- persistence (per-viewer convenience only) ----------
function save() {
  try { localStorage.setItem('pf-state', JSON.stringify(state)); } catch (e) {}
}
function restore() {
  try {
    const s = JSON.parse(localStorage.getItem('pf-state') || 'null');
    if (s) Object.assign(state, s, { frame: Object.assign(state.frame, s.frame || {}) });
  } catch (e) {}
}

// ---------- server calls ----------
async function api(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: 'Bad response from server' }));
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}
async function loadGeometry() {
  try {
    geo = await api('/api/geometry', { params: state.frame });
    setStatus('');
  } catch (e) { setStatus(e.message, true); }
  draw();
}

// ---------- image ----------
function setImage(src) {
  const im = new Image();
  im.onload = () => {
    img = im;
    // keep a moderately sized copy to send to the server
    const maxSide = 2400, k = Math.min(1, maxSide / Math.max(im.width, im.height));
    const c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    imgData = c.toDataURL('image/png');
    makeStencil();
    draw();
  };
  im.src = src;
}
function makeStencil() {
  if (!img) return;
  const k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height);   // transparent = dark
  g.drawImage(img, 0, 0, c.width, c.height);
  const d = g.getImageData(0, 0, c.width, c.height), a = d.data, t = state.threshold * 255;
  for (let i = 0; i < a.length; i += 4) {
    let v = 0.299 * a[i] + 0.587 * a[i + 1] + 0.114 * a[i + 2];
    if (state.invert) v = 255 - v;
    const on = v > t;
    a[i] = on ? 255 : 0; a[i + 1] = on ? 246 : 0; a[i + 2] = on ? 225 : 0; a[i + 3] = 255;
  }
  g.putImageData(d, 0, 0);
  stencil = c;
}

// ---------- view transform (wall mm <-> canvas px) ----------
let view = { s: 1, ox: 0, oy: 0 };
function fitView() {
  const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  const ex = geo ? geo.extent[0] : 300, ey = geo ? geo.extent[1] : 200;
  view.s = Math.min(canvas.width / (2 * ex * 1.08), canvas.height / (2 * ey * 1.08));
  view.ox = canvas.width / 2; view.oy = canvas.height / 2;
}
const sx = x => view.ox + x * view.s, sy = y => view.oy - y * view.s;
const toMM = (px, py) => [(px - view.ox) / view.s, (view.oy - py) / view.s];

// ---------- drawing ----------
function rectPath(g, hx, hy) { g.rect(sx(-hx), sy(hy), 2 * hx * view.s, 2 * hy * view.s); }

function draw() {
  fitView();
  ctx.fillStyle = '#0b0c0e'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!geo) return;
  const [ex, ey] = geo.extent, [ix, iy] = geo.inner, [ox, oy] = geo.outer;

  // the picture
  if (img) {
    const w = state.width, h = state.width * img.height / img.width;
    const src = state.view === 'stencil' ? stencil : img;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(src, sx(state.cx - w / 2), sy(state.cy + h / 2), w * view.s, h * view.s);
  }
  // dim everything that will not be lit
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, canvas.width, canvas.height);
  rectPath(ctx, ox, oy); rectPath(ctx, ix, iy);
  ctx.fillStyle = 'rgba(8,9,11,0.78)';
  ctx.fill('evenodd');
  ctx.restore();
  // lit-area outline and corner seams
  ctx.lineWidth = Math.max(1, view.s * 0.6);
  ctx.strokeStyle = 'rgba(245,165,36,.55)';
  ctx.setLineDash([6, 5]);
  ctx.beginPath(); rectPath(ctx, ox, oy); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(0,0,0,.7)';
  ctx.lineWidth = Math.max(1, view.s * 2.2);
  for (const [a, b] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
    ctx.beginPath(); ctx.moveTo(sx(a * ix), sy(b * iy)); ctx.lineTo(sx(a * ox), sy(b * oy)); ctx.stroke();
  }
  // the frame on top
  const [bx, by] = geo.bezel, [wx, wy] = geo.window;
  ctx.fillStyle = '#4a3527';
  ctx.beginPath(); rectPath(ctx, bx, by); ctx.fill();
  ctx.fillStyle = '#8b8f99';
  ctx.beginPath(); rectPath(ctx, wx, wy); ctx.fill();
  ctx.fillStyle = '#1e1f22';
  ctx.font = `${Math.max(11, 13 * (window.devicePixelRatio || 1))}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('your photo', sx(0), sy(0));

  // scale bar
  const bar = 100, y0 = canvas.height - 16 * (window.devicePixelRatio || 1);
  ctx.strokeStyle = '#9aa2ab'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(canvas.width - 20 - bar * view.s, y0); ctx.lineTo(canvas.width - 20, y0); ctx.stroke();
  ctx.fillStyle = '#9aa2ab'; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillText('100 mm', canvas.width - 20, y0 - 4);
  syncInputs();
}

// ---------- inputs ----------
function syncInputs() {
  $('size').value = Math.round(state.width);
  $('sizeLabel').textContent = Math.round(state.width) + ' mm';
  if (document.activeElement !== $('cx')) $('cx').value = Math.round(state.cx);
  if (document.activeElement !== $('cy')) $('cy').value = Math.round(state.cy);
  $('thr').value = state.threshold; $('thrLabel').textContent = (+state.threshold).toFixed(2);
  $('invert').checked = state.invert;
  for (const k of FRAME_KEYS) if (document.activeElement !== $(k)) $(k).value = state.frame[k];
  $('vStencil').classList.toggle('on', state.view === 'stencil');
  $('vPhoto').classList.toggle('on', state.view === 'photo');
}
function changed() { save(); draw(); }

$('size').addEventListener('input', e => { state.width = +e.target.value; changed(); });
$('cx').addEventListener('change', e => { state.cx = +e.target.value || 0; changed(); });
$('cy').addEventListener('change', e => { state.cy = +e.target.value || 0; changed(); });
$('thr').addEventListener('input', e => { state.threshold = +e.target.value; makeStencil(); changed(); });
$('invert').addEventListener('change', e => { state.invert = e.target.checked; makeStencil(); changed(); });
$('vStencil').onclick = () => { state.view = 'stencil'; changed(); };
$('vPhoto').onclick = () => { state.view = 'photo'; changed(); };
for (const k of FRAME_KEYS) $(k).addEventListener('change', e => {
  const v = parseFloat(e.target.value);
  if (!isNaN(v)) { state.frame[k] = v; save(); loadGeometry(); }
});
$('center').onclick = () => { state.cx = 0; state.cy = 0; changed(); };
$('fitW').onclick = () => { if (geo) { state.width = 2 * geo.outer[0]; changed(); } };
$('fitH').onclick = () => {
  if (geo && img) { state.width = 2 * geo.outer[1] * img.width / img.height; changed(); }
};
$('load').onclick = () => $('file').click();
$('file').onchange = e => { const f = e.target.files[0]; if (f) readFile(f); };
function readFile(f) { const r = new FileReader(); r.onload = () => setImage(r.result); r.readAsDataURL(f); }

// drag & drop
const stage = $('stage');
stage.addEventListener('dragover', e => { e.preventDefault(); $('drop').classList.add('on'); });
stage.addEventListener('dragleave', () => $('drop').classList.remove('on'));
stage.addEventListener('drop', e => {
  e.preventDefault(); $('drop').classList.remove('on');
  const f = e.dataTransfer.files[0]; if (f && f.type.startsWith('image/')) readFile(f);
});

// move with the pointer, resize with the wheel (about the pointer)
let drag = null;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId); canvas.classList.add('dragging');
  const dpr = window.devicePixelRatio || 1;
  drag = { x: e.offsetX * dpr, y: e.offsetY * dpr, cx: state.cx, cy: state.cy };
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  const dpr = window.devicePixelRatio || 1;
  state.cx = drag.cx + (e.offsetX * dpr - drag.x) / view.s;
  state.cy = drag.cy - (e.offsetY * dpr - drag.y) / view.s;
  draw();
});
canvas.addEventListener('pointerup', () => { drag = null; canvas.classList.remove('dragging'); save(); });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const dpr = window.devicePixelRatio || 1;
  const [mx, my] = toMM(e.offsetX * dpr, e.offsetY * dpr);
  const k = Math.exp(-e.deltaY * 0.0015);
  const nw = Math.min(3000, Math.max(30, state.width * k)), f = nw / state.width;
  state.cx = mx + (state.cx - mx) * f; state.cy = my + (state.cy - my) * f;
  state.width = nw; changed();
}, { passive: false });
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const d = e.shiftKey ? 10 : 1;
  const m = { ArrowLeft: [-d, 0], ArrowRight: [d, 0], ArrowUp: [0, d], ArrowDown: [0, -d] }[e.key];
  if (m) { e.preventDefault(); state.cx += m[0]; state.cy += m[1]; changed(); }
});
window.addEventListener('resize', draw);

// ---------- preview / build ----------
function setStatus(msg, err) { $('status').textContent = msg; $('status').classList.toggle('err', !!err); }
function setBusy(b) { busy = b; $('preview').disabled = b; $('build').disabled = b; }
function payload() {
  return { image: imgData, width: state.width, cx: state.cx, cy: state.cy,
    threshold: state.threshold, invert: state.invert, params: state.frame };
}
async function run(kind) {
  if (!imgData) { setStatus('Load an image first.', true); return; }
  setBusy(true);
  const t0 = performance.now();
  setStatus(kind === 'build' ? 'Cutting the stencils and building the STLs… (can take a minute)'
                             : 'Computing the stencils…');
  try {
    const j = await api('/api/' + kind, payload());
    const secs = ((performance.now() - t0) / 1000).toFixed(0);
    const res = $('result'); res.innerHTML = '';
    const im = document.createElement('img'); im.src = j.preview; im.alt = 'Simulated projection';
    im.onclick = () => { $('modalImg').src = j.preview; $('modal').classList.add('on'); };
    res.appendChild(im);
    if (kind === 'build') {
      const a = document.createElement('a');
      a.href = j.zip; a.download = 'projector_frame_stls.zip'; a.className = 'dl';
      a.textContent = 'Download STLs (.zip)';
      const p = document.createElement('p'); p.appendChild(a);
      p.appendChild(document.createTextNode(' · also saved in ' + j.out_dir));
      res.prepend(p);
      setStatus(`Done in ${secs} s. ${j.files.length} files.` + (j.warnings.length ? '\n' + j.warnings.join('\n') : ''));
    } else {
      setStatus(`Simulated projection (${secs} s). Click it to enlarge.`);
    }
  } catch (e) { setStatus(e.message, true); }
  setBusy(false);
}
$('preview').onclick = () => run('preview');
$('build').onclick = () => run('build');
$('modal').onclick = () => $('modal').classList.remove('on');

// ---------- start ----------
restore();
syncInputs();
loadGeometry().then(() => fetch('/api/default-image').then(r => r.ok ? r.blob() : null).then(b => {
  if (b) { const r = new FileReader(); r.onload = () => setImage(r.result); r.readAsDataURL(b); }
}));
</script>
</body>
</html>
